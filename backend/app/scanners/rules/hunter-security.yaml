  - id: hunter.crypto.static-iv-python
    patterns:
      - pattern-either:
          - pattern: AES.new($KEY, $MODE, iv=b"...")
          - pattern: AES.new($KEY, $MODE, nonce=b"...")
          - pattern: |
              $IV = b"..."
              ...
              AES.new($KEY, $MODE, iv=$IV)
    message: >
      Static/hardcoded initialization vector (IV) or nonce used for encryption.
      Reusing an IV with the same key destroys confidentiality (CBC) or both
      confidentiality and authenticity (GCM/CTR). Generate a random IV for
      each encryption operation using os.urandom().
    severity: ERROR
    languages: [python]
    metadata:
      cwe: "CWE-329"
      owasp: "A02:2021 - Cryptographic Failures"
      category: cryptography
      confidence: high
      impact: high

