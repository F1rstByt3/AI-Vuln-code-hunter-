      cwe: "CWE-327"
      owasp: "A02:2021 - Cryptographic Failures"
      category: cryptography
      confidence: high
      impact: high

  - id: hunter.crypto.rsa-weak-keysize
    patterns:
      - pattern-either:
          - pattern: RSA.generate(1024)
          - pattern: RSA.generate(512)
          - pattern: rsa.generate_private_key(..., key_size=1024, ...)
          - pattern: rsa.generate_private_key(..., key_size=512, ...)
          - pattern: KeyPairGenerator.getInstance("RSA").initialize(1024)
          - pattern: KeyPairGenerator.getInstance("RSA").initialize(512)
