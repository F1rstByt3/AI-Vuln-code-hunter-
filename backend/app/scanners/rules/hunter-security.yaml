  # CATEGORY 12: RACE CONDITIONS
  # ============================================================================

  - id: hunter.race.toctou-python
    patterns:
      - pattern-either:
          - pattern: |
              if os.path.exists($PATH):
                  ...
                  open($PATH, ...)
          - pattern: |
              if os.path.isfile($PATH):
                  ...
                  open($PATH, ...)
    message: >
      Time-of-check/time-of-use (TOCTOU) race condition. The file state
      may change between the existence check and the file operation. An
      attacker can exploit this to read/write unintended files via symlink
      races. Use atomic operations or file locking.
    severity: WARNING
    languages: [python]
    metadata:
      cwe: "CWE-367"
      owasp: "A04:2021 - Insecure Design"
      category: race-condition
      confidence: medium
      impact: medium

  - id: hunter.race.toctou-js
    patterns:
      - pattern-either:
          - pattern: |
              if (fs.existsSync($PATH)) {
                  ...
                  fs.readFileSync($PATH)
              }
          - pattern: |
              fs.access($PATH, ..., function(...) {
                  ...
                  fs.readFile($PATH, ...)
              })
    message: >
      TOCTOU race condition in Node.js. File checked then used in separate
      operations. Use atomic operations (open with appropriate flags) or
      try/catch on the operation directly instead of checking then acting.
    severity: WARNING
    languages: [javascript, typescript]
    metadata:
      cwe: "CWE-367"
      owasp: "A04:2021 - Insecure Design"
      category: race-condition
      confidence: medium
      impact: medium
