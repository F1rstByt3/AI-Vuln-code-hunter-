rules:
  # ============================================================================
  # CATEGORY 1: AUTHENTICATION & SESSION
  # ============================================================================

  - id: hunter.auth.jwt-alg-none
    patterns:
      - pattern-either:
          - pattern: jwt.encode($PAYLOAD, ..., algorithm="none")
          - pattern: jwt.encode($PAYLOAD, ..., algorithm="None")
          - pattern: |
              jwt.sign($PAYLOAD, ..., {algorithm: "none", ...})
          - pattern: jwt.decode($TOKEN, ..., algorithms=["none"])
    message: >
      JWT algorithm set to "none" disables signature verification entirely.
      An attacker can forge arbitrary JWT tokens and impersonate any user.
      Always enforce a strong algorithm (RS256, ES256).
    severity: ERROR
    languages: [python, javascript, typescript]
    metadata:
      cwe: "CWE-327"
      owasp: "A02:2021 - Cryptographic Failures"
      category: authentication
      confidence: high
      impact: critical

  - id: hunter.auth.jwt-weak-hmac-secret
    patterns:
      - pattern-either:
          - pattern: jwt.encode($PAYLOAD, "...", ...)
          - pattern: jwt.sign($PAYLOAD, "...", ...)
          - pattern: jwt.decode($TOKEN, "...", ...)
          - pattern: jwt.verify($TOKEN, "...", ...)
    message: >
      JWT signed/verified with a hardcoded string secret. If this secret is
      short or predictable, an attacker can brute-force it offline and forge
      tokens. Use a strong randomly-generated secret loaded from environment/vault.
    severity: ERROR
    languages: [python, javascript, typescript]
    metadata:
      cwe: "CWE-321"
      owasp: "A02:2021 - Cryptographic Failures"
      category: authentication
      confidence: high
      impact: high

  - id: hunter.auth.jwt-decode-no-verify
    patterns:
      - pattern-either:
          - pattern: |
              jwt.decode($TOKEN, ..., options={"verify_signature": False})
          - pattern: |
              jwt.decode($TOKEN, ..., options={..., "verify_signature": False, ...})
          - pattern: jwt.decode($TOKEN, ..., verify=False)
    message: >
      JWT decoded without signature verification. An attacker can modify
      any claim in the token (user ID, role, permissions) without detection.
      Always verify JWT signatures with the appropriate key and algorithm.
    severity: ERROR
    languages: [python]
    metadata:
      cwe: "CWE-347"
      owasp: "A02:2021 - Cryptographic Failures"
      category: authentication
      confidence: high
      impact: critical

  - id: hunter.auth.jwt-no-expiry-check
    patterns:
      - pattern: |
          jwt.decode($TOKEN, ..., options={..., "verify_exp": False, ...}, ...)
    message: >
      JWT decoded with expiration verification disabled. Stolen tokens can
      be replayed indefinitely. Ensure verify_exp is not set to False.
    severity: WARNING
    languages: [python]
    metadata:
      cwe: "CWE-613"
      owasp: "A07:2021 - Identification and Authentication Failures"
      category: authentication
      confidence: high
      impact: high

  - id: hunter.auth.hardcoded-aws-key
    pattern-regex: "(?:AKIA|ABIA|ACCA|ASIA)[0-9A-Z]{16}"
    message: >
      Hardcoded AWS access key detected (AKIA/ASIA prefix pattern).
      This key grants access to AWS services and should never appear in source
      code. Rotate immediately. Use IAM roles, instance profiles, or
      environment variables instead.
    severity: ERROR
    languages: [generic]
    metadata:
      cwe: "CWE-798"
      owasp: "A07:2021 - Identification and Authentication Failures"
      category: secrets
      confidence: high
      impact: critical

  - id: hunter.auth.hardcoded-private-key
    pattern-regex: "-----BEGIN (RSA |EC |DSA |OPENSSH )?PRIVATE KEY-----"
    message: >
      Private key embedded in source code. Private keys must be stored
      in secure key management systems, never in code repositories.
      Rotate this key immediately.
    severity: ERROR
    languages: [generic]
    metadata:
      cwe: "CWE-321"
      owasp: "A02:2021 - Cryptographic Failures"
      category: secrets
      confidence: high
      impact: critical

  - id: hunter.auth.hardcoded-bearer-token
    pattern-regex: "(?i)(Authorization|Bearer)[\"':\\s]+Bearer\\s+[A-Za-z0-9\\-_\\.]{20,}"
    message: >
      Hardcoded Bearer token in source code. Tokens should be loaded from
      secure configuration, environment variables, or vault systems.
    severity: ERROR
    languages: [generic]
    metadata:
      cwe: "CWE-798"
      owasp: "A07:2021 - Identification and Authentication Failures"
      category: secrets
      confidence: medium
      impact: high

  - id: hunter.auth.hardcoded-generic-secret
    pattern-regex: "(?i)(password|secret|token|api_key|apikey|api-key|passwd|credentials?)\\s*[=:]\\s*[\"'][^\"'\\s]{8,}[\"']"
    message: >
      Potential hardcoded secret (password, token, API key) detected.
      Secrets must not be committed to source control. Use a secrets manager
      or environment variables.
    severity: WARNING
    languages: [generic]
    metadata:
      cwe: "CWE-798"
      owasp: "A07:2021 - Identification and Authentication Failures"
      category: secrets
      confidence: medium
      impact: high

  - id: hunter.auth.weak-password-hash-python
    patterns:
      - pattern-either:
          - pattern: hashlib.md5($PASSWORD).hexdigest()
          - pattern: hashlib.sha1($PASSWORD).hexdigest()
          - pattern: hashlib.md5($PASSWORD.encode(...)).hexdigest()
          - pattern: hashlib.sha1($PASSWORD.encode(...)).hexdigest()
    message: >
      Weak hashing algorithm (MD5/SHA1) used for what appears to be password
      hashing. These are fast hash functions vulnerable to brute-force and
      rainbow table attacks. Use bcrypt, argon2, or scrypt for password storage.
    severity: ERROR
    languages: [python]
    metadata:
      cwe: "CWE-328"
      owasp: "A02:2021 - Cryptographic Failures"
      category: authentication
      confidence: high
      impact: high

  - id: hunter.auth.weak-password-hash-java
    patterns:
      - pattern-either:
          - pattern: MessageDigest.getInstance("MD5")
          - pattern: MessageDigest.getInstance("SHA-1")
          - pattern: MessageDigest.getInstance("SHA1")
    message: >
      Weak hashing algorithm (MD5/SHA1) used in Java. If used for passwords
      or integrity verification of sensitive data, this is exploitable.
      Use bcrypt/scrypt/PBKDF2 for passwords, SHA-256+ for integrity.
    severity: ERROR
    languages: [java]
    metadata:
      cwe: "CWE-328"
      owasp: "A02:2021 - Cryptographic Failures"
      category: authentication
      confidence: high
      impact: high

  - id: hunter.auth.weak-password-hash-php
    patterns:
      - pattern-either:
          - pattern: md5($PASSWORD)
          - pattern: sha1($PASSWORD)
    message: >
      MD5/SHA1 used for hashing in PHP. Use password_hash() with
      PASSWORD_BCRYPT or PASSWORD_ARGON2ID for password storage.
    severity: ERROR
    languages: [php]
    metadata:
      cwe: "CWE-328"
      owasp: "A02:2021 - Cryptographic Failures"
      category: authentication
      confidence: high
      impact: high

  - id: hunter.auth.session-fixation-python
    patterns:
      - pattern: |
          def $LOGIN_FUNC(...):
              ...
              request.session[$KEY] = ...
      - pattern-not: |
          def $LOGIN_FUNC(...):
              ...
              request.session.cycle_key()
              ...
      - pattern-not: |
          def $LOGIN_FUNC(...):
              ...
              request.session.flush()
              ...
    message: >
      Session data set during login without regenerating the session ID.
      This enables session fixation attacks where an attacker pre-sets a
      session ID and waits for the victim to authenticate with it.
      Call request.session.cycle_key() or flush() before setting session data.
    severity: WARNING
    languages: [python]
    metadata:
      cwe: "CWE-384"
      owasp: "A07:2021 - Identification and Authentication Failures"
      category: authentication
      confidence: medium
      impact: high

  - id: hunter.auth.csrf-exempt-django
    patterns:
      - pattern: |
          @csrf_exempt
          def $FUNC(request):
              ...
    message: >
      Django view explicitly exempt from CSRF protection. If this endpoint
      performs state-changing operations, an attacker can forge cross-site
      requests from victim users' browsers. Only exempt endpoints that use
      API token-based authentication exclusively.
    severity: WARNING
    languages: [python]
    metadata:
      cwe: "CWE-352"
      owasp: "A01:2021 - Broken Access Control"
      category: authentication
      confidence: high
      impact: medium

  # ============================================================================
  # CATEGORY 2: INJECTION
  # ============================================================================

  - id: hunter.injection.sql-string-concat-python
    patterns:
      - pattern-either:
          - pattern: $CURSOR.execute("..." + $VAR + "...")
          - pattern: $CURSOR.execute("..." % $VAR)
          - pattern: $CURSOR.execute("...".format($VAR))
          - pattern: |
              $CURSOR.execute(f"...{$VAR}...")
          - pattern: |
              $CURSOR.executemany(f"...{$VAR}...")
          - pattern: $DB.execute("..." + $VAR + "...")
          - pattern: |
              $DB.execute(f"...{$VAR}...")
          - pattern: $DB.execute("...".format($VAR))
          - pattern: $DB.execute("..." % $VAR)
          - pattern: |
              $DB.raw(f"...{$VAR}...")
      - pattern-not: $CURSOR.execute("..." + "..." + "...")
    message: >
      SQL query built via string concatenation/formatting with variable input.
      This is a classic SQL injection vector. Use parameterized queries
      (cursor.execute("SELECT ... WHERE id = %s", (id,))) instead.
    severity: ERROR
    languages: [python]
    metadata:
      cwe: "CWE-89"
      owasp: "A03:2021 - Injection"
      category: injection
      confidence: high
      impact: critical

  - id: hunter.injection.sql-raw-django
    patterns:
      - pattern-either:
          - pattern: $MODEL.objects.raw("..." + $VAR + "...")
          - pattern: |
              $MODEL.objects.raw(f"...{$VAR}...")
          - pattern: $MODEL.objects.extra(where=["..." + $VAR + "..."])
          - pattern: |
              $MODEL.objects.extra(where=[f"...{$VAR}..."])
          - pattern: connection.cursor().execute("..." + $VAR + "...")
          - pattern: |
              connection.cursor().execute(f"...{$VAR}...")
    message: >
      Raw SQL query with string concatenation in Django ORM. This bypasses
      Django's built-in SQL injection protection. Use parameterized queries:
      Model.objects.raw("SELECT ... WHERE id = %s", [id]).
    severity: ERROR
    languages: [python]
    metadata:
      cwe: "CWE-89"
      owasp: "A03:2021 - Injection"
      category: injection
      confidence: high
      impact: critical

  - id: hunter.injection.sql-string-concat-java
    patterns:
      - pattern-either:
          - pattern: $STMT.executeQuery("..." + $VAR + "...")
          - pattern: $STMT.execute("..." + $VAR + "...")
          - pattern: $CONN.createStatement().executeQuery("..." + $VAR + "...")
          - pattern: |
              String $Q = "..." + $VAR + "...";
              ...
              $STMT.executeQuery($Q);
    message: >
      SQL query built with string concatenation in Java. Use PreparedStatement
      with parameter binding to prevent SQL injection.
    severity: ERROR
    languages: [java]
    metadata:
      cwe: "CWE-89"
      owasp: "A03:2021 - Injection"
      category: injection
      confidence: high
      impact: critical

  - id: hunter.injection.sql-string-concat-js
    patterns:
      - pattern-either:
          - pattern: $DB.query("..." + $VAR + "...")
          - pattern: |
              $DB.query(`...${$VAR}...`)
          - pattern: $CONN.query("..." + $VAR + "...")
          - pattern: |
              $CONN.query(`...${$VAR}...`)
          - pattern: |
              $CONN.execute(`...${$VAR}...`)
          - pattern: |
              $POOL.query(`...${$VAR}...`)
          - pattern: $POOL.query("..." + $VAR + "...")
    message: >
      SQL query built with string concatenation/template literals in JavaScript.
      Use parameterized queries (e.g., db.query("SELECT * WHERE id = ?", [id])).
    severity: ERROR
    languages: [javascript, typescript]
    metadata:
      cwe: "CWE-89"
      owasp: "A03:2021 - Injection"
      category: injection
      confidence: high
      impact: critical

  - id: hunter.injection.sql-string-concat-csharp
    patterns:
      - pattern-either:
          - pattern: new SqlCommand("..." + $VAR + "...", ...)
          - pattern: |
              new SqlCommand($"...{$VAR}...", ...)
          - pattern: $CMD.CommandText = "..." + $VAR + "..."
          - pattern: |
              $CMD.CommandText = $"...{$VAR}..."
    message: >
      SQL query built with string concatenation in C#. Use SqlParameter
      or parameterized queries to prevent SQL injection.
    severity: ERROR
    languages: [csharp]
    metadata:
      cwe: "CWE-89"
      owasp: "A03:2021 - Injection"
      category: injection
      confidence: high
      impact: critical

  - id: hunter.injection.sql-string-concat-ruby
    patterns:
      - pattern-either:
          - pattern: $MODEL.where("..." + $VAR + "...")
          - pattern: |
              $MODEL.where("...#{$VAR}...")
          - pattern: |
              ActiveRecord::Base.connection.execute("...#{$VAR}...")
    message: >
      SQL query built with string interpolation in Ruby. Use parameterized
      queries (Model.where("col = ?", val)) to prevent SQL injection.
    severity: ERROR
    languages: [ruby]
    metadata:
      cwe: "CWE-89"
      owasp: "A03:2021 - Injection"
      category: injection
      confidence: high
      impact: critical

  - id: hunter.injection.sql-string-concat-php
    patterns:
      - pattern-either:
          - pattern: mysqli_query($CONN, "..." . $VAR . "...")
          - pattern: $PDO->query("..." . $VAR . "...")
          - pattern: mysql_query("..." . $VAR . "...")
          - pattern: $PDO->query("...$VAR...")
    message: >
      SQL query built with string concatenation in PHP. Use prepared
      statements with PDO::prepare() and bound parameters.
    severity: ERROR
    languages: [php]
    metadata:
      cwe: "CWE-89"
      owasp: "A03:2021 - Injection"
      category: injection
      confidence: high
      impact: critical

  - id: hunter.injection.sql-string-concat-go
    pattern-regex: "(?:Query|Exec|QueryRow)\\(.*fmt\\.Sprintf|(?:Query|Exec|QueryRow)\\(.*\\+.*\\+"
    message: >
      SQL query built with string concatenation or fmt.Sprintf in Go. Use
      parameterized queries with $1/$2 placeholders (PostgreSQL) or ?
      placeholders (MySQL) to prevent SQL injection.
    severity: ERROR
    languages: [go]
    metadata:
      cwe: "CWE-89"
      owasp: "A03:2021 - Injection"
      category: injection
      confidence: medium
      impact: critical

  - id: hunter.injection.nosql-operator-injection
    patterns:
      - pattern-either:
          - pattern: $COLLECTION.find($REQ.body)
          - pattern: $COLLECTION.findOne($REQ.body)
          - pattern: |
              $COLLECTION.find({...: $REQ.body.$FIELD})
          - pattern: |
              $COLLECTION.findOne({...: $REQ.query.$FIELD})
          - pattern: $COLLECTION.deleteMany($REQ.body)
          - pattern: $COLLECTION.updateOne($REQ.body, ...)
          - pattern: $MODEL.find($REQ.body)
          - pattern: $MODEL.findOne($REQ.body)
    message: >
      User input passed directly as a MongoDB query object. An attacker can
      inject MongoDB operators (e.g., {"$gt": ""}, {"$ne": null}) to bypass
      authentication or extract data. Validate and sanitize input, or use
      mongo-sanitize to strip $ operators.
    severity: ERROR
    languages: [javascript, typescript]
    metadata:
      cwe: "CWE-943"
      owasp: "A03:2021 - Injection"
      category: injection
      confidence: high
      impact: critical

  - id: hunter.injection.nosql-where-injection
    patterns:
      - pattern-either:
          - pattern: |
              $COLLECTION.find({$where: $INPUT})
          - pattern: |
              $COLLECTION.find({"$where": $INPUT})
    message: >
      MongoDB $where clause with potentially user-controlled input enables
      server-side JavaScript execution. This can lead to data exfiltration
      or denial of service. Avoid $where entirely; use standard query operators.
    severity: ERROR
    languages: [javascript, typescript]
    metadata:
      cwe: "CWE-943"
      owasp: "A03:2021 - Injection"
      category: injection
      confidence: high
      impact: critical

  - id: hunter.injection.ldap-python
    patterns:
      - pattern-either:
          - pattern: |
              $CONN.search_s($BASE, ..., f"...{$VAR}...", ...)
          - pattern: $CONN.search_s($BASE, ..., "...%s..." % $VAR, ...)
          - pattern: $CONN.search_s($BASE, ..., "...".format($VAR), ...)
    message: >
      LDAP query built with string formatting using potentially user-controlled
      input. An attacker can inject LDAP filter operators to bypass
      authentication or extract directory data. Use
      ldap.filter.escape_filter_chars() on input.
    severity: ERROR
    languages: [python]
    metadata:
      cwe: "CWE-90"
      owasp: "A03:2021 - Injection"
      category: injection
      confidence: high
      impact: high

  - id: hunter.injection.os-command-python
    patterns:
      - pattern-either:
          - pattern: |
              os.system(f"...{$X}...")
          - pattern: os.system("..." + $X + "...")
          - pattern: |
              os.popen(f"...{$X}...")
          - pattern: os.popen("..." + $X + "...")
          - pattern: |
              subprocess.call(f"...{$X}...", shell=True, ...)
          - pattern: |
              subprocess.run(f"...{$X}...", shell=True, ...)
          - pattern: |
              subprocess.Popen(f"...{$X}...", shell=True, ...)
          - pattern: |
              subprocess.check_output(f"...{$X}...", shell=True, ...)
          - pattern: subprocess.call($CMD, shell=True, ...)
          - pattern: subprocess.run($CMD, shell=True, ...)
      - pattern-not: os.system("...")
      - pattern-not: subprocess.call("...", shell=True, ...)
      - pattern-not: subprocess.run("...", shell=True, ...)
    message: >
      OS command execution with potentially user-controlled input via shell=True.
      An attacker can inject shell metacharacters (; | && ` $()) to execute
      arbitrary commands. Use subprocess with shell=False and a command list.
    severity: ERROR
    languages: [python]
    metadata:
      cwe: "CWE-78"
      owasp: "A03:2021 - Injection"
      category: injection
      confidence: high
      impact: critical

  - id: hunter.injection.os-command-js
    patterns:
      - pattern-either:
          - pattern: |
              child_process.exec(`...${$X}...`)
          - pattern: child_process.exec("..." + $X + "...")
          - pattern: |
              child_process.execSync(`...${$X}...`)
          - pattern: child_process.execSync("..." + $X + "...")
          - pattern: |
              require("child_process").exec(`...${$X}...`)
          - pattern: |
              require("child_process").execSync(`...${$X}...`)
          - pattern: |
              $CP.exec(`...${$X}...`)
      - pattern-not: child_process.exec("...", ...)
      - pattern-not: child_process.execSync("...", ...)
    message: >
      OS command execution with potentially dynamic input in Node.js.
      Use child_process.execFile() or spawn() with argument arrays
      instead of exec() which invokes a shell.
    severity: ERROR
    languages: [javascript, typescript]
    metadata:
      cwe: "CWE-78"
      owasp: "A03:2021 - Injection"
      category: injection
      confidence: high
      impact: critical

  - id: hunter.injection.os-command-java
    patterns:
      - pattern-either:
          - pattern: Runtime.getRuntime().exec($CMD)
          - pattern: Runtime.getRuntime().exec($CMD + ...)
          - pattern: new ProcessBuilder($CMD).start()
      - pattern-not: Runtime.getRuntime().exec("...")
    message: >
      OS command execution in Java with potentially user-controlled input.
      Validate and sanitize all input, use allowlists for permitted commands,
      and avoid shell invocation.
    severity: ERROR
    languages: [java]
    metadata:
      cwe: "CWE-78"
      owasp: "A03:2021 - Injection"
      category: injection
      confidence: high
      impact: critical

  - id: hunter.injection.os-command-ruby
    patterns:
      - pattern-either:
          - pattern: |
              system("...#{$CMD}...")
          - pattern: |
              `#{$CMD}`
          - pattern: |
              IO.popen("...#{$CMD}...")
          - pattern: |
              Open3.capture3("...#{$CMD}...")
          - pattern: |
              Kernel.exec("...#{$CMD}...")
    message: >
      OS command execution in Ruby with string interpolation. An attacker
      can inject shell metacharacters to execute arbitrary commands. Use
      Shellwords.escape() or pass command and arguments as separate array
      elements to avoid shell interpretation.
    severity: ERROR
    languages: [ruby]
    metadata:
      cwe: "CWE-78"
      owasp: "A03:2021 - Injection"
      category: injection
      confidence: high
      impact: critical

  - id: hunter.injection.os-command-php
    patterns:
      - pattern-either:
          - pattern: system($CMD)
          - pattern: exec($CMD)
          - pattern: passthru($CMD)
          - pattern: shell_exec($CMD)
          - pattern: popen($CMD, ...)
          - pattern: proc_open($CMD, ...)
      - pattern-not: system("...")
      - pattern-not: exec("...")
      - pattern-not: shell_exec("...")
      - pattern-not: passthru("...")
    message: >
      OS command execution in PHP with potentially user-controlled input.
      Use escapeshellarg() and escapeshellcmd() to sanitize input, or
      avoid shell commands entirely.
    severity: ERROR
    languages: [php]
    metadata:
      cwe: "CWE-78"
      owasp: "A03:2021 - Injection"
      category: injection
      confidence: high
      impact: critical

  - id: hunter.injection.ssti-python-jinja2
    patterns:
      - pattern-either:
          - pattern: Template($USER_INPUT).render(...)
          - pattern: $ENV.from_string($USER_INPUT).render(...)
          - pattern: jinja2.Template($USER_INPUT).render(...)
          - pattern: render_template_string($USER_INPUT)
          - pattern: render_template_string($REQ. ...)
    message: >
      User input passed directly to Jinja2 template rendering, enabling
      Server-Side Template Injection (SSTI). An attacker can execute arbitrary
      Python code via {{config.__class__.__init__.__globals__['os'].popen('cmd')}}.
      Use render_template() with .html files, never render_template_string()
      with user input.
    severity: ERROR
    languages: [python]
    metadata:
      cwe: "CWE-1336"
      owasp: "A03:2021 - Injection"
      category: injection
      confidence: high
      impact: critical

  - id: hunter.injection.ssti-python-mako
    patterns:
      - pattern-either:
          - pattern: mako.template.Template($USER_INPUT).render(...)
          - pattern: Template($USER_INPUT).render(...)
    message: >
      User input passed to Mako template engine. Mako templates can execute
      arbitrary Python code, enabling SSTI with full RCE. Use pre-compiled
      template files, not dynamic template strings from user input.
    severity: ERROR
    languages: [python]
    metadata:
      cwe: "CWE-1336"
      owasp: "A03:2021 - Injection"
      category: injection
      confidence: high
      impact: critical

  - id: hunter.injection.ssti-js-pug-ejs
    patterns:
      - pattern-either:
          - pattern: pug.render($USER_INPUT, ...)
          - pattern: pug.compile($USER_INPUT, ...)
          - pattern: ejs.render($USER_INPUT, ...)
          - pattern: $NUNJUCKS.renderString($USER_INPUT, ...)
          - pattern: ejs.render($REQ.body.$FIELD, ...)
          - pattern: pug.render($REQ.body.$FIELD, ...)
    message: >
      User-controlled input used as a template string in Pug/EJS/Nunjucks,
      enabling Server-Side Template Injection. Use pre-compiled template
      files, not dynamic template strings.
    severity: ERROR
    languages: [javascript, typescript]
    metadata:
      cwe: "CWE-1336"
      owasp: "A03:2021 - Injection"
      category: injection
      confidence: high
      impact: critical

  - id: hunter.injection.ssti-thymeleaf-java
    patterns:
      - pattern-either:
          - pattern: $ENGINE.process($USER_INPUT, $CTX)
          - pattern: new SpringTemplateEngine().process($USER_INPUT, ...)
    message: >
      Potential Server-Side Template Injection via Thymeleaf. If the template
      string is user-controlled, attackers can execute arbitrary Java code
      via expressions like ${T(java.lang.Runtime).getRuntime().exec('cmd')}.
    severity: ERROR
    languages: [java]
    metadata:
      cwe: "CWE-1336"
      owasp: "A03:2021 - Injection"
      category: injection
      confidence: medium
      impact: critical

  - id: hunter.injection.expression-language-spring
    patterns:
      - pattern-either:
          - pattern: new SpelExpressionParser().parseExpression($INPUT)
          - pattern: $PARSER.parseExpression($INPUT)
      - pattern-not: $PARSER.parseExpression("...")
    message: >
      User input passed to Spring Expression Language (SpEL) parser.
      An attacker can execute arbitrary Java code via expressions like
      T(java.lang.Runtime).getRuntime().exec('cmd'). Never evaluate
      user-controlled SpEL expressions.
    severity: ERROR
