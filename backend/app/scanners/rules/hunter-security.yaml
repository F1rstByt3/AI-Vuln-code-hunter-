          - pattern: Cipher.getInstance("DES/ECB/...")
          - pattern: createCipheriv("aes-128-ecb", ...)
          - pattern: createCipheriv("aes-256-ecb", ...)
    message: >
      ECB (Electronic Codebook) mode encrypts identical plaintext blocks
      to identical ciphertext blocks, leaking data patterns (the "ECB penguin"
      problem). Use CBC with random IV, or preferably GCM for authenticated
      encryption.
    severity: ERROR
    languages: [python, java, javascript, typescript]
    metadata:
      cwe: "CWE-327"
      owasp: "A02:2021 - Cryptographic Failures"
      category: cryptography
      confidence: high
