[project]
name = "ai-vuln-code-hunter"
version = "0.1.0"
description = "Agentic AI code-security review platform (Azure AI Foundry)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "pydantic[email]>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "arq>=0.26",
    "redis>=5.0",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
    "aioboto3>=13.0",
    "boto3>=1.34",
    "pyjwt[crypto]>=2.8",
    "openai>=1.40",                 # Azure OpenAI / Foundry inference client
    "azure-identity>=1.17",         # SP / managed-identity auth
    "azure-storage-blob>=12.20",    # prod object storage
]

[project.optional-dependencies]
dev = ["pytest>=8.2", "pytest-asyncio>=0.23", "ruff>=0.5", "aiosqlite>=0.20"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]   # FastAPI Depends() in defaults is idiomatic

[tool.pytest.ini_options]
asyncio_mode = "auto"
